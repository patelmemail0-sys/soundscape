<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22354a"/>
      <stop offset="1" stop-color="#0a1320"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cf0c8"/>
      <stop offset="1" stop-color="#17a87f"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f8fb"/>
      <stop offset="1" stop-color="#d9e0ea"/>
    </linearGradient>
  </defs>
  <!-- macOS icon canvas: 824 px squircle centred on a 1024 px grid -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <!-- left speaker -->
  <rect x="190" y="318" width="186" height="388" rx="44" fill="url(#body)"/>
  <circle cx="283" cy="420" r="38" fill="#0a1320"/>
  <circle cx="283" cy="584" r="74" fill="#0a1320"/>
  <circle cx="283" cy="584" r="30" fill="url(#acc)"/>
  <!-- right speaker -->
  <rect x="648" y="318" width="186" height="388" rx="44" fill="url(#body)"/>
  <circle cx="741" cy="420" r="38" fill="#0a1320"/>
  <circle cx="741" cy="584" r="74" fill="#0a1320"/>
  <circle cx="741" cy="584" r="30" fill="url(#acc)"/>
  <!-- sound waves meeting in the middle: in sync -->
  <g fill="none" stroke="url(#acc)" stroke-width="34" stroke-linecap="round">
    <path d="M414 452 c 52 42 52 118 0 160"/>
    <path d="M610 452 c -52 42 -52 118 0 160"/>
  </g>
  <circle cx="512" cy="532" r="30" fill="url(#acc)"/>
</svg>
