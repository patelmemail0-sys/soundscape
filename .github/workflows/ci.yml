name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check soundscape tests
      - run: pytest -q --ignore=tests/live

  unit-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q --ignore=tests/live
      # the real CoreAudio binding loads and enumerates devices on the runner
      - run: python -c "from soundscape.mac.coreaudio import CoreAudio; ds = CoreAudio().devices(); print(len(ds), 'devices'); print([(d.name, d.transport) for d in ds])"
      - run: SOUNDSCAPE_PLATFORM=mac soundscape doctor || true

  live-pipewire:
    # Real PipeWire + WirePlumber + pipewire-pulse, with null sinks standing in for speakers.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y pipewire pipewire-bin pipewire-pulse wireplumber pulseaudio-utils dbus
      - run: python -m pip install -e '.[dev]'
      - name: start the audio stack
        run: |
          export XDG_RUNTIME_DIR=/tmp/xdg; mkdir -p $XDG_RUNTIME_DIR; chmod 700 $XDG_RUNTIME_DIR
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> $GITHUB_ENV
          dbus-daemon --session --fork --print-address > /tmp/dbus.addr --nopidfile
          echo "DBUS_SESSION_BUS_ADDRESS=$(cat /tmp/dbus.addr)" >> $GITHUB_ENV
          export DBUS_SESSION_BUS_ADDRESS=$(cat /tmp/dbus.addr)
          nohup pipewire > /tmp/pw.log 2>&1 &
          sleep 2
          nohup wireplumber > /tmp/wp.log 2>&1 &
          sleep 2
          nohup pipewire-pulse > /tmp/pwp.log 2>&1 &
          sleep 2
          pactl info
          spa-json-dump /dev/null || true
      - name: validate generated engine config with PipeWire's parser
        run: |
          python - <<'EOF'
          from soundscape.pipewire import EnginePlan, OutputPlan, render_config
          outs = [OutputPlan("left", "A", "bluez_output.AA_BB_CC_DD_EE_01.1"), OutputPlan("right", "B", "bluez_output.AA_BB_CC_DD_EE_02.1", 5)]
          open("/tmp/a.conf", "w").write(render_config(EnginePlan(outs, stereo_split=True)))
          open("/tmp/b.conf", "w").write(render_config(EnginePlan(outs, with_delays=False)))
          EOF
          spa-json-dump /tmp/a.conf > /dev/null && spa-json-dump /tmp/b.conf > /dev/null
      - run: SOUNDSCAPE_LIVE=1 pytest -q tests/live -v
      - name: logs on failure
        if: failure()
        run: tail -n 50 /tmp/pw.log /tmp/wp.log /tmp/pwp.log || true
